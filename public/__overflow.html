<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;font:13px/1.5 monospace;background:#fff;color:#111}
#out{padding:10px;white-space:pre-wrap}
iframe{width:390px;height:9000px;border:0;position:absolute;left:-9999px;top:0}
b{color:#b00}
</style></head><body>
<div id="out">mesure…</div>
<iframe id="f" src="/fr" scrolling="no"></iframe>
<script>
const f = document.getElementById('f');
f.onload = () => {
  setTimeout(() => {
    const d = f.contentDocument, W = 390;
    const lines = [];
    lines.push('viewport iframe : ' + f.clientWidth);
    lines.push('documentElement.scrollWidth : ' + d.documentElement.scrollWidth);
    lines.push('body.scrollWidth : ' + d.body.scrollWidth);
    lines.push('--- éléments dépassant ' + W + 'px ---');
    const seen = [];
    d.querySelectorAll('*').forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.right > W + 1 && r.width > 0) {
        const sel = el.tagName.toLowerCase() +
          (el.id ? '#' + el.id : '') +
          (el.className && typeof el.className === 'string'
             ? '.' + el.className.trim().split(/\s+/).slice(0,3).join('.') : '');
        seen.push({ sel, right: Math.round(r.right), w: Math.round(r.width), depth: (()=>{let n=0,p=el;while(p=p.parentElement)n++;return n;})() });
      }
    });
    seen.sort((a,b)=>b.right-a.right);
    const uniq = [];
    const keys = new Set();
    for (const s of seen) { if (!keys.has(s.sel)) { keys.add(s.sel); uniq.push(s); } }
    uniq.slice(0,28).forEach(s => lines.push('right=' + s.right + '  w=' + s.w + '  ' + s.sel));
    document.getElementById('out').textContent = lines.join('\n');
  }, 2500);
};
</script></body></html>
